# Configuración de SonarQube para Games API
sonar.projectKey=games-api
sonar.projectName=Games API
sonar.projectVersion=1.0

# Rutas del código fuente
sonar.sources=app,config,database,routes
sonar.tests=tests

# Lenguaje del proyecto
sonar.language=php

# Codificación
sonar.sourceEncoding=UTF-8

# Rutas a excluir del análisis
sonar.exclusions=\
    **/vendor/**,\
    **/storage/**,\
    **/bootstrap/cache/**,\
    **/public/**,\
    **/node_modules/**,\
    **/*.blade.php

# Rutas de tests a excluir
sonar.test.exclusions=\
    **/vendor/**,\
    **/storage/**

# Cobertura de código (si tienes PHPUnit con coverage)
# sonar.php.coverage.reportPaths=coverage.xml

# Resultados de PHPUnit
# sonar.php.tests.reportPath=phpunit-report.xml

